modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"

description='''
Curio Utilities adds Curios slots and integrations for special items from other mods.
'''

[[mixins]]
config="curioutilities.mixins.json"
requiredMods=["naturescompass"]

[[mixins]]
config="curioutilities.aether.mixins.json"
requiredMods=["aether"]

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="curios"
type="required"
versionRange="[9.5.1,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="naturescompass"
type="optional"
versionRange="[1.21.1-3.4.0-neoforge]"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="explorerscompass"
type="optional"
versionRange="[1.21.1-3.4.0-neoforge]"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="aether"
type="optional"
versionRange="[1.5.10,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="waystones"
type="optional"
versionRange="[21.1.46,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="caelus"
type="required"
versionRange="[7.0.1,)"
ordering="AFTER"
side="BOTH"
