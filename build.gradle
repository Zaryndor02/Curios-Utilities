plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Compilation : les JAR doivent etre presents dans libs/
    compileOnly files("libs/NaturesCompass-1.21.1-3.4.0-neoforge.jar")
    compileOnly files("libs/ExplorersCompass-1.21.1-3.4.0-neoforge.jar")
    compileOnly files("libs/curios-neoforge-9.5.1+1.21.1.jar")

    // Caelus (OBLIGATOIRE) : l'API (CaelusApi) est utilisee a la compilation
    compileOnly files("libs/caelus-neoforge-7.0.1+1.21.1.jar")

    // Aether + sa dépendance owo-lib
    compileOnly files("libs/aether-1.21.1-1.5.10-neoforge.jar")
    compileOnly files("libs/accessories-neoforge-1.1.0-beta.53+1.21.1.jar")
    compileOnly files("libs/owo-lib-neoforge-0.12.15.5-beta.1+1.21.jar")

    // Lancement en dev (runClient).
    localRuntime files("libs/NaturesCompass-1.21.1-3.4.0-neoforge.jar")
    localRuntime files("libs/ExplorersCompass-1.21.1-3.4.0-neoforge.jar")
    localRuntime files("libs/curios-neoforge-9.5.1+1.21.1.jar")

    // Caelus (OBLIGATOIRE)
    localRuntime files("libs/caelus-neoforge-7.0.1+1.21.1.jar")

    // Aether + sa dépendance owo-lib
    localRuntime files("libs/aether-1.21.1-1.5.10-neoforge.jar")
    localRuntime files("libs/owo-lib-neoforge-0.12.15.5-beta.1+1.21.jar")

    // Accessories : version plus récente pour remplacer celle embarquée par Aether
    localRuntime files("libs/accessories-neoforge-1.1.0-beta.53+1.21.1.jar")

    // Waystones est optionnel. Balm est auto-detecte s'il est present dans libs/.
    localRuntime files("libs/waystones-neoforge-1.21.1-21.1.46.jar")
    localRuntime fileTree(dir: "libs", include: "balm-neoforge-*.jar")
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
    ]

    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
